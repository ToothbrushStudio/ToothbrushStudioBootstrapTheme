name: Publish

# Publishes to npm when a v* tag is pushed, or on manual dispatch.
# Requires repo secret NPM_TOKEN (an npm automation token with publish rights
# for the @toothbrushstudio scope).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assert compiled output carries the brand
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
